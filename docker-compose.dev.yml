services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-it_tms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-it_tms}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  db-migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-it_tms}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - sh
      - -eu
      - -c
      - |
        for migration in /migrations/*.up.sql; do
          if [ -f "$${migration}" ]; then
            echo "Applying $${migration}...";
            psql -h db -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-it_tms} -f "$${migration}";
          fi
        done
    networks:
      - dev-network
    restart: "no"

  db-seed:
    image: golang:1.23-alpine
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    working_dir: /workspace/apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/it_tms?sslmode=disable}
      GO_ENV: development
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /go-build
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go-build
    command:
      - sh
      - -eu
      - -c
      - |
        echo 'Seeding development database...';
        go run cmd/seed/main.go;
        echo 'Database ready.'
    networks:
      - dev-network
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    depends_on:
      db-seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/it_tms?sslmode=disable}
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-1234567890}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:3000}
      GO_ENV: development
      SECURE_COOKIES: "false"
      WEB_APP_URL: http://localhost:3000
      UPLOAD_DIR: uploads
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-unisight-bucket-1}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-unisight-472720}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/unisight-472720-f2fa16e4d501.json
    volumes:
      - ./apps/api:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - api-uploads:/app/uploads
      - ./unisight-472720-f2fa16e4d501.json:/app/credentials/unisight-472720-f2fa16e4d501.json:ro
    ports:
      - "8080:8080"
    command:
      - sh
      - -eu
      - -c
      - |
        go install github.com/air-verse/air@v1.52.3;
        air -c .air.toml
    networks:
      - dev-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      api:
        condition: service_started
    working_dir: /workspace
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
      NEXT_PUBLIC_SOCKET_URL: ws://localhost:8080/ws
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/node_modules
      - web-app-node-modules:/workspace/apps/web/node_modules
      - web-ui-node-modules:/workspace/packages/ui/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "3000:3000"
    command:
      - sh
      - -eu
      - -c
      - |
        pnpm install --frozen-lockfile --prefer-offline;
        pnpm --filter @it-tms/web dev
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  pgdata-dev:
  go-mod-cache:
  go-build-cache:
  api-uploads:
  pnpm-store:
  web-node-modules:
  web-app-node-modules:
  web-ui-node-modules:
