name: Deploy to Production

on:
  push:
    branches: [ main ]

env:
  VM_ZONE: asia-southeast1-b
  VM_NAME: unisight-dev-vm
  DEPLOY_DIR: /opt/unisight

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Deploy to VM
        run: |
          echo "Starting deployment to production..."
          
          # SSH into VM and run deployment commands
          gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.VM_ZONE }} --command="
            set -e
            echo 'Navigating to deployment directory...'
            cd ${{ env.DEPLOY_DIR }}
            
            echo 'Pulling latest changes from main branch...'
            sudo git pull origin main
            
            echo 'Building and deploying with docker-compose...'
            sudo docker-compose -f docker-compose.gcp.yml build --no-cache web
            
            echo 'Starting core services first (without nginx)...'
            sudo docker-compose -f docker-compose.gcp.yml up -d db db-migrate db-seed api web
            
            echo 'Waiting for services to be ready...'
            sleep 15
            
            echo 'Checking SSL certificates...'
            if [ ! -f '/etc/letsencrypt/live/unisight.dev/fullchain.pem' ]; then
              echo 'SSL certificates not found, generating new ones...'
              
              # Start nginx with HTTP-only config temporarily
              sudo cp nginx/nginx.conf nginx/nginx.conf.temp
              sudo docker-compose -f docker-compose.gcp.yml up -d nginx
              
              # Wait for nginx to be ready
              sleep 10
              
              # Generate SSL certificates
              echo 'Requesting SSL certificate from Let'\''s Encrypt...'
              sudo docker run --rm -v certbot-etc:/etc/letsencrypt -v certbot-var:/var/lib/letsencrypt -v certbot-www:/var/www/certbot certbot/certbot certonly --webroot -w /var/www/certbot -d unisight.dev -d www.unisight.dev --email admin@unisight.dev --agree-tos --non-interactive --expand
              
              if [ -f '/etc/letsencrypt/live/unisight.dev/fullchain.pem' ]; then
                echo 'SSL certificates generated successfully!'
              else
                echo 'SSL certificate generation failed, continuing with HTTP-only...'
              fi
            else
              echo 'SSL certificates already exist!'
            fi
            
            echo 'Starting nginx with final configuration...'
            sudo docker-compose -f docker-compose.gcp.yml up -d nginx
            
            echo 'Checking service health...'
            sleep 10
            sudo docker-compose -f docker-compose.gcp.yml ps
            
            echo 'Deployment completed successfully!'
          "
      
      - name: Verify deployment
        run: |
          echo "Verifying deployment health..."
          gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.VM_ZONE }} --command="
            cd ${{ env.DEPLOY_DIR }}
            echo 'Checking service status...'
            sudo docker-compose -f docker-compose.gcp.yml ps
            echo 'Checking container logs for any errors...'
            sudo docker-compose -f docker-compose.gcp.yml logs --tail=20 web api
          "
