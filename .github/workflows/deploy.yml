name: Deploy to Production

on:
  push:
    branches: [ main ]

env:
  VM_ZONE: asia-southeast1-b
  VM_NAME: unisight-dev-vm
  DEPLOY_DIR: /opt/unisight

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Deploy to VM
        run: |
          echo "Starting deployment to production..."
          
          # Create temporary script to avoid command line parsing issues with JSON
          cat > deploy_script.sh << 'EOF'
          #!/bin/bash
          set -e
          echo 'Navigating to deployment directory...'
          cd /opt/unisight
          
          echo 'Pulling latest changes from main branch...'
          sudo git pull origin main
          
          echo 'Setting up environment file...'
          sudo cp env.gcp .env
          EOF
          
          # Add the GCS credentials injection to the script using Google Cloud Secret Manager
          echo "" >> deploy_script.sh
          echo "echo 'Retrieving GCS credentials from Secret Manager...'" >> deploy_script.sh
          echo 'GCS_CREDS=$(gcloud secrets versions access latest --secret="gcs-service-account-key" --project="unisight-472720")' >> deploy_script.sh
          echo 'echo "GOOGLE_APPLICATION_CREDENTIALS_JSON=$GCS_CREDS" | sudo tee -a .env > /dev/null' >> deploy_script.sh
          
          # Copy script to VM and execute it
          gcloud compute scp deploy_script.sh ${{ env.VM_NAME }}:~/deploy_script.sh --zone=${{ env.VM_ZONE }}
          gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.VM_ZONE }} --command="chmod +x ~/deploy_script.sh && ~/deploy_script.sh"
          
          # Continue with the rest of the deployment
          gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.VM_ZONE }} --command="
            set -e
            cd ${{ env.DEPLOY_DIR }}
            
            echo 'Building and deploying with docker-compose...'
            sudo docker-compose -f docker-compose.gcp.yml build --no-cache web
            
            echo 'Starting core services first (without nginx)...'
            sudo docker-compose -f docker-compose.gcp.yml up -d db db-migrate db-seed api web
            
            echo 'Waiting for services to be ready...'
            sleep 15
            
            echo 'Checking SSL certificates...'
            if [ ! -f '/etc/letsencrypt/live/unisight.dev/fullchain.pem' ]; then
              echo 'SSL certificates not found, generating new ones...'
              
              # Stop nginx temporarily for standalone certificate generation
              sudo docker-compose -f docker-compose.gcp.yml stop nginx || true
              
              # Generate SSL certificates using standalone method
              echo 'Requesting SSL certificate from Let'\''s Encrypt using standalone method...'
              sudo docker run --rm -p 80:80 -v certbot-etc:/etc/letsencrypt -v certbot-var:/var/lib/letsencrypt certbot/certbot certonly --standalone -d unisight.dev -d www.unisight.dev --email admin@unisight.dev --agree-tos --non-interactive --expand
              
              if [ -f '/etc/letsencrypt/live/unisight.dev/fullchain.pem' ]; then
                echo 'SSL certificates generated successfully!'
              else
                echo 'SSL certificate generation failed, will continue with HTTP-only configuration'
              fi
            else
              echo 'SSL certificates already exist!'
            fi
            
            echo 'Starting nginx with appropriate configuration...'
            if [ -f '/etc/letsencrypt/live/unisight.dev/fullchain.pem' ]; then
              echo 'SSL certificates found, using SSL configuration'
              # Ensure SSL config is active
              sudo cp nginx/nginx-ssl.conf nginx/nginx.conf
            else
              echo 'No SSL certificates, using HTTP-only configuration'
              # Ensure HTTP config is active
              sudo cp nginx/nginx.conf nginx/nginx.conf.backup 2>/dev/null || true
            fi
            
            sudo docker-compose -f docker-compose.gcp.yml up -d nginx
            
            echo 'Checking service health...'
            sleep 10
            sudo docker-compose -f docker-compose.gcp.yml ps
            
            echo 'Deployment completed successfully!'
            if [ -f '/etc/letsencrypt/live/unisight.dev/fullchain.pem' ]; then
              echo '✅ SSL is enabled - your site is accessible via HTTPS'
            else
              echo '⚠️  SSL certificate generation failed - your site is accessible via HTTP only'
              echo '   To enable SSL manually, run the certificate generation command on your VM'
            fi
            
            # Clean up temporary files
            rm -f ~/deploy_script.sh
          "
          
          # Clean up local temporary files
          rm -f deploy_script.sh
      
      - name: Verify deployment
        run: |
          echo "Verifying deployment health..."
          gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.VM_ZONE }} --command="
            cd ${{ env.DEPLOY_DIR }}
            echo 'Checking service status...'
            sudo docker-compose -f docker-compose.gcp.yml ps
            echo 'Checking container logs for any errors...'
            sudo docker-compose -f docker-compose.gcp.yml logs --tail=20 web api
          "
